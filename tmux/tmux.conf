# tmux config. Add to ~/.tmux.conf:  source-file /path/to/env/tmux/tmux.conf
#
# Deliberately unriced. The old purple status bar, tpm and four plugins were
# harvested in 2026; this field lies fallow. Keep it that way.

set -g mouse on

# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split with | and -, keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Alt+arrow moves between panes (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Machine-specific overrides
%if "#{!=:$XDG_CONFIG_HOME,}"
source-file -q "$XDG_CONFIG_HOME/env/tmux.local.conf"
%else
source-file -q ~/.config/env/tmux.local.conf
%endif
