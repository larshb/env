# tmux config. Add to ~/.tmux.conf:  source-file /path/to/env/tmux/tmux.conf

set -g mouse on

# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split with | and -, keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Machine-specific overrides
source-file -q ~/.config/env/tmux.local.conf
