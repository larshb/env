# tmux config. Add to ~/.tmux.conf:  source-file /path/to/env/tmux/tmux.conf
# Machine-specific overrides: ~/.config/env/tmux.local.conf (see README)

# --- General ------------------------------------------------------------------
# Shell: tmux uses $SHELL. To force one, put this in tmux.local.conf:
#   set -g default-command bash
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g allow-rename off
set -g mouse on

# Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and -, keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Alt-arrow switches panes without prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind r source-file ~/.tmux.conf \; display 'Config reloaded'
bind m set -g mouse on  \; display 'Mouse: ON'
bind M set -g mouse off \; display 'Mouse: OFF'

# --- Theme defaults (override any @env-* option in tmux.local.conf) -----------
set -g @env-accent        colour93   # status bar and pane borders
set -g @env-accent-active colour201  # active pane border
set -g @env-date          colour54   # date segment background
set -g @env-time          colour8    # time segment background

# --- Plugins (add more with set -g @plugin in tmux.local.conf) ----------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @continuum-restore 'on'

# --- Local overrides ----------------------------------------------------------
source-file -q ~/.config/env/tmux.local.conf

# --- Apply theme --------------------------------------------------------------
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'

set -gF pane-border-style        'bg=default fg=#{@env-accent}'
set -gF pane-active-border-style 'bg=default fg=#{@env-accent-active}'

set -g  status-position bottom
set -g  status-justify left
set -gF status-style 'bg=#{@env-accent} fg=colour137 dim'
set -g  status-left ''
set -g  status-left-length 20
set -g  status-right-length 50
set -g  status-right '#[fg=colour233,bg=#{@env-date}] %d/%m #[fg=colour233,bg=#{@env-time}] %H:%M:%S '

setw -g window-status-current-style  'fg=colour1 bg=colour19 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '
setw -g window-status-style          'fg=colour9 bg=colour18'
setw -g window-status-format         ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-bell-style     'fg=colour255 bg=colour1 bold'

set -g message-style 'fg=colour231 bg=colour0 bold'

# Initialize plugin manager (keep at the bottom)
run -b '~/.tmux/plugins/tpm/tpm'
